name: Build KhargYar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/khargyar/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KhargYar"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.khargyar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.khargyar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="خرج‌یار"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:navigationBarColor">#F5F7FB</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/khargyar/app/MainActivity.java <<'EOF'
          package com.khargyar.app;

          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.text.NumberFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout list;
              TextView total;
              ArrayList<String> items = new ArrayList<>();
              ArrayList<Long> amounts = new ArrayList<>();
              long sum = 0;

              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView tv(String text, float size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(Color.rgb(25, 35, 55));
                  t.setPadding(dp(12), dp(8), dp(12), dp(8));
                  return t;
              }

              String money(long n) {
                  return NumberFormat.getInstance(new Locale("fa", "IR")).format(n) + " تومان";
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  build();
              }

              void build() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(20), dp(16), dp(12));
                  root.setBackgroundColor(Color.rgb(247,249,252));

                  TextView title = tv("خرج‌یار", 28);
                  title.setTextColor(Color.rgb(20,70,150));
                  title.setTypeface(null, 1);
                  root.addView(title);

                  TextView sub = tv("مدیریت ساده هزینه‌های روزانه", 15);
                  root.addView(sub);

                  total = tv("مجموع هزینه‌ها: ۰ تومان", 20);
                  total.setTypeface(null, 1);
                  total.setPadding(dp(16),dp(18),dp(16),dp(18));
                  root.addView(total);

                  Button add = new Button(this);
                  add.setText("＋ ثبت هزینه جدید");
                  add.setOnClickListener(v -> dialog());
                  root.addView(add, new LinearLayout.LayoutParams(-1, dp(54)));

                  TextView h = tv("هزینه‌های ثبت‌شده", 18);
                  h.setTypeface(null, 1);
                  root.addView(h);

                  ScrollView scroll = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  setContentView(root);
              }

              void dialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20),dp(8),dp(20),0);

                  EditText amount = new EditText(this);
                  amount.setHint("مبلغ به تومان");
                  amount.setInputType(2);
                  box.addView(amount);

                  EditText desc = new EditText(this);
                  desc.setHint("عنوان هزینه");
                  box.addView(desc);

                  String[] cats = {"خوراک","حمل‌ونقل","خرید","قبض","سرگرمی","سایر"};
                  Spinner sp = new Spinner(this);
                  sp.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, cats));
                  box.addView(sp);

                  new AlertDialog.Builder(this)
                      .setTitle("ثبت هزینه")
                      .setView(box)
                      .setNegativeButton("لغو", null)
                      .setPositiveButton("ثبت", (d,w) -> {
                          String a = amount.getText().toString().trim();
                          String de = desc.getText().toString().trim();
                          if (a.isEmpty()) return;
                          long n;
                          try { n = Long.parseLong(a); } catch(Exception e) { return; }
                          if (de.isEmpty()) de = "هزینه";
                          String row = de + "  •  " + sp.getSelectedItem().toString();
                          items.add(row);
                          amounts.add(n);
                          sum += n;
                          refresh();
                      }).show();
              }

              void refresh() {
                  total.setText("مجموع هزینه‌ها: " + money(sum));
                  list.removeAllViews();
                  for (int i=items.size()-1;i>=0;i--) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(8),dp(10),dp(8),dp(10));

                      TextView name = tv(items.get(i),16);
                      row.addView(name, new LinearLayout.LayoutParams(0, -2, 1));

                      TextView val = tv(money(amounts.get(i)),15);
                      val.setTypeface(null,1);
                      row.addView(val);

                      list.addView(row);
                      View line = new View(this);
                      line.setBackgroundColor(Color.rgb(225,230,238));
                      list.addView(line, new LinearLayout.LayoutParams(-1,1));
                  }
              }
          }
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhargYar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
